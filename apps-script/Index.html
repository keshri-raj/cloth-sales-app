<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avani Suto</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{--navy:#0c2c49;--navy2:#163c5b;--orange:#df6b38;--paper:#f5f7fa;--white:#fff;--ink:#192a39;--muted:#657384;--line:#e0e6eb;--green:#21855c;--red:#b64a43;--blue:#3672a4;--shadow:0 12px 32px #10253b0d;--radius:18px;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--paper);font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.app{min-height:100vh}.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:13px;padding:0 8px}.brand-mark{height:42px;width:42px;border-radius:13px;background:var(--orange);display:grid;place-items:center;font-family:Georgia,serif;font-weight:800;font-size:26px;color:#fff}.brand-name{font:700 19px Georgia,serif;letter-spacing:.03em}.brand-sub{font-size:12px;color:#c4d1dc;margin-top:4px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#c7d3dd;text-align:left;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:13px;font-weight:600}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .nav-icon{width:20px;text-align:center;font-size:18px}.side-foot{margin-top:auto;border-top:1px solid #ffffff28;padding:18px 8px 0;color:#b9c9d7;font-size:13px;line-height:1.5}.main{min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4vw,54px);position:sticky;top:0;z-index:5}.top-title{font-weight:700;color:var(--navy);font-size:16px}.top-user{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#edf2f6;color:var(--navy);font-weight:700}.badge{border-radius:999px;padding:5px 10px;background:#edf2f6;color:var(--navy);font-size:12px;font-weight:700}.page{max-width:1440px;margin:auto;padding:34px clamp(22px,4vw,54px) 60px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--orange);font-weight:800;margin-bottom:8px}.page h1{font-size:30px;line-height:1.15;color:var(--navy);margin:0}.page-sub{margin-top:8px;color:var(--muted);font-size:15px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid transparent;border-radius:11px;padding:11px 16px;font-weight:700;transition:.15s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy2)}.btn-accent{background:var(--orange);color:#fff}.btn-light{background:#fff;border-color:var(--line);color:var(--navy)}.btn-danger{background:#fff;color:var(--red);border-color:#eac9c6}.btn-small{font-size:13px;padding:8px 11px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:24px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:22px}.stat-label{color:var(--muted);font-weight:600;font-size:14px}.stat-value{font-size:30px;font-weight:800;color:var(--navy);margin-top:12px}.stat-note{font-size:13px;color:var(--muted);margin-top:7px}.panel{padding:22px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel-title{font-size:18px;color:var(--navy);font-weight:750}.panel-note{font-size:13px;color:var(--muted);margin-top:5px}.quick-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:22px}.quick{padding:20px;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--navy);font-weight:700}.quick:hover{border-color:#b8c8d4;box-shadow:var(--shadow)}.quick-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#fce9df;color:var(--orange);font-size:20px}.table-card{overflow:hidden}.table-toolbar{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.search{min-width:240px;max-width:460px;width:100%;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px 11px 38px;outline:none;background:#fff}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#8aa2b5;box-shadow:0 0 0 3px #0c2c4910}.search span{position:absolute;left:13px;top:10px;color:#7b8996}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:14px 18px;border-bottom:1px solid #edf0f3}th{font-size:12px;color:#778491;text-transform:uppercase;letter-spacing:.06em;background:#fbfcfd}td{font-size:14px}tbody tr:hover{background:#fbfcfd}.clickable{cursor:pointer}.strong{font-weight:700;color:var(--navy)}.muted{color:var(--muted)}.money{font-weight:750;color:var(--navy)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:750;background:#e9f4ed;color:var(--green)}.status.due{background:#fff0e2;color:#a85f1d}.status.void{background:#fae8e7;color:var(--red)}.status.order{background:#e9f0fa;color:var(--blue)}.status.pending{background:#fff4df;color:#996718}.status-row{display:flex;align-items:center;gap:8px}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 15px;color:var(--muted);font-weight:700}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.two-col{grid-template-columns:minmax(0,1fr) 330px}.side-summary{padding:22px;height:max-content}.summary-line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.summary-line:last-child{border:0}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#526171}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;outline:none;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.notice{padding:12px 14px;background:#fff5eb;border:1px solid #f3d7c8;border-radius:10px;color:#874c2e;font-size:14px}.veil{position:fixed;inset:0;background:#081b2bd1;display:grid;place-items:center;z-index:20;padding:24px}.login{width:min(460px,100%);padding:38px;background:#fff;border-radius:22px;text-align:center;box-shadow:0 28px 90px #0004}.login .brand-mark{margin:0 auto 17px;width:58px;height:58px;font-size:32px}.login h1{margin:0;color:var(--navy);font:700 27px Georgia,serif}.login p{color:var(--muted);line-height:1.55;margin:12px auto 22px;max-width:340px}.login-error{color:var(--red);font-size:14px;margin-top:14px}.drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:#fff;z-index:15;box-shadow:-20px 0 50px #11283b24;padding:28px;overflow:auto;transform:translateX(105%);transition:transform .2s}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.drawer h2{margin:0;color:var(--navy);font-size:23px}.close{border:0;background:#f1f4f7;color:var(--navy);width:36px;height:36px;border-radius:10px;font-size:20px}.drawer-section{padding:17px 0;border-top:1px solid var(--line)}.drawer-section h3{margin:0 0 12px;color:var(--navy);font-size:15px}.line-item{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #edf0f3}.toast{position:fixed;bottom:24px;right:24px;z-index:40;background:var(--navy);color:#fff;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);max-width:420px}.toast.error{background:#9f3934}.modal-back{position:fixed;inset:0;background:#091c2db5;z-index:25;display:grid;place-items:center;padding:20px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:26px;box-shadow:0 25px 80px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal-head h2{margin:0;color:var(--navy)}.suggestions{position:absolute;z-index:3;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:100%;margin-top:4px;max-height:230px;overflow:auto}.suggestions button{width:100%;text-align:left;border:0;background:#fff;padding:12px}.suggestions button:hover{background:#f3f6f8}.relative{position:relative}.product-picker{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:end;margin:18px 0}.cart{border:1px solid var(--line);border-radius:13px;padding:8px 14px;margin:15px 0}.cart-row{display:grid;grid-template-columns:1fr 100px 120px 35px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f3}.cart-row:last-child{border:0}.photo-small{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#edf1f4}.hidden{display:none!important}.loading{opacity:.55;pointer-events:none}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.detail-row{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid #edf0f3}.mobile-nav{display:none}
    @media(max-width:1050px){.shell{grid-template-columns:210px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.side-summary{order:-1}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.shell{display:block;padding-bottom:68px}.sidebar{display:none}.topbar{height:62px;padding:0 18px}.top-user{gap:7px;font-size:12px}.page{padding:24px 17px 35px}.page h1{font-size:25px}.page-head{display:block}.page-head .actions{margin-top:18px}.stats{gap:10px}.stat{padding:16px}.stat-value{font-size:24px}.quick-grid{grid-template-columns:1fr}.table-toolbar{align-items:stretch;flex-direction:column}.search{max-width:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:11px;display:grid;justify-items:center;gap:3px}.mobile-nav button.active{color:var(--orange)}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.product-picker{grid-template-columns:1fr 90px}.product-picker .btn{grid-column:1/-1}.cart-row{grid-template-columns:1fr 76px 92px 30px;font-size:13px}.drawer{padding:22px}.modal{padding:20px}.page-sub{font-size:14px}}
    @media(max-width:410px){.stats{grid-template-columns:1fr 1fr}.stat-value{font-size:21px}.top-title{font-size:14px}.badge{display:none}}
  </style>
</head>
<body>
  <div class="app hidden" id="app">
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">A</div><div><div class="brand-name">AVANI SUTO</div><div class="brand-sub">Shop workspace</div></div></div>
        <nav class="nav" id="sideNav">
          <button data-page="home" class="active"><span class="nav-icon">⌂</span>Overview</button>
          <button data-page="bills"><span class="nav-icon">▤</span>Bills</button>
          <button data-page="customers"><span class="nav-icon">♙</span>Customers</button>
          <button data-page="cloth"><span class="nav-icon">▣</span>Cloth</button>
          <button data-page="payments"><span class="nav-icon">₹</span>Payments</button>
          <button data-page="orders"><span class="nav-icon">◷</span>Order requests</button>
          <button data-page="approvals" id="approvalsNav" class="hidden"><span class="nav-icon">✓</span>Approvals <span id="approvalCount" class="badge hidden"></span></button>
        </nav>
        <div class="side-foot"><div id="sideEmail">Signed out</div><div>Shop records sync from Google Sheets</div></div>
      </aside>
      <main class="main">
        <header class="topbar"><div class="top-title">Avani Suto <span style="color:#a9b4bd">/</span> <span id="crumb">Overview</span></div><div class="top-user"><span class="badge" id="roleBadge">Staff</span><span class="avatar" id="avatar">A</span><span id="userEmail"></span><button class="btn btn-light btn-small" id="signOut">Sign out</button></div></header>
        <section class="page" id="page"></section>
      </main>
    </div>
    <nav class="mobile-nav" id="mobileNav">
      <button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="bills"><span>▤</span>Bills</button><button data-page="customers"><span>♙</span>Customers</button><button data-page="cloth"><span>▣</span>Cloth</button><button data-page="payments"><span>₹</span>Payments</button>
    </nav>
  </div>
  <div class="veil" id="loginVeil"><div class="login"><div class="brand-mark">A</div><h1>Avani Suto</h1><p>Sign in with an approved Google account to manage shop sales, customers, cloth, and payments.</p><div id="googleButton"></div><div class="login-error" id="loginError"></div></div></div>
  <aside class="drawer" id="drawer"><div class="drawer-head"><div><div class="eyebrow">Record details</div><h2 id="drawerTitle"></h2></div><button class="close" id="drawerClose">×</button></div><div id="drawerBody"></div></aside>
  <div id="modalHost"></div><div id="toastHost"></div>
  <script>
    const GOOGLE_CLIENT_ID = '<?= googleClientId ?>';
    const state = {token:'',user:null,page:'home',cache:{products:[],customers:[],bills:[],payments:[],orders:[],approvals:[]},cart:[],billCustomer:null,activePaymentTab:'due'};
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = value => '₹' + Number(value || 0).toLocaleString('en-IN',{maximumFractionDigits:2});
    const dateShort = value => { if(!value)return '—'; const d=new Date(value); return isNaN(d)?esc(value):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
    function toast(message,error=false){const node=document.createElement('div');node.className='toast'+(error?' error':'');node.textContent=message;$('toastHost').replaceChildren(node);setTimeout(()=>node.remove(),4200)}
    function api(action,payload={}){return new Promise((resolve,reject)=>{if(!state.token)return reject(new Error('Sign in again to continue.'));const done=result=>{if(!result||!result.ok){reject(new Error(result?.error||'The request could not be completed.'));return}resolve(result)};const failed=error=>reject(new Error(error?.message||'Could not reach the Shop backend.'));if(window.google?.script?.run){google.script.run.withSuccessHandler(done).withFailureHandler(failed).webApi(action,payload,state.token);return}fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,payload,idToken:state.token})}).then(response=>response.json()).then(done).catch(failed)})}
    function run(action,payload,onSuccess){const page=$('page');page.classList.add('loading');api(action,payload).then(result=>{page.classList.remove('loading');onSuccess?.(result)}).catch(error=>{page.classList.remove('loading');toast(error.message,true)})}
    function signInCredential(response){state.token=response.credential;api('session').then(session=>{state.user=session;sessionStorage.setItem('avaniToken',state.token);startApp()}).catch(error=>{state.token='';$('loginError').textContent=error.message})}
    function initGoogle(){if(!window.google?.accounts?.id){setTimeout(initGoogle,200);return}google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:signInCredential,auto_select:false});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:260})}
    function startApp(){ $('loginVeil').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=state.user.email;$('sideEmail').textContent=state.user.email;$('roleBadge').textContent=state.user.role==='ADMIN'?'Administrator':'Salesperson';$('avatar').textContent=(state.user.email||'A').slice(0,1).toUpperCase();if(state.user.role==='ADMIN')$('approvalsNav').classList.remove('hidden');navigate('home');syncAll() }
    function signOut(){state.token='';state.user=null;sessionStorage.removeItem('avaniToken');$('app').classList.add('hidden');$('loginVeil').classList.remove('hidden');$('loginError').textContent='';if(window.google?.accounts?.id)google.accounts.id.disableAutoSelect()}
    function setNav(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('crumb').textContent=({home:'Overview',bills:'Bills',customers:'Customers',cloth:'Cloth',payments:'Payments',orders:'Order requests',approvals:'Approvals'})[page]||'Overview'}
    function navigate(page){state.page=page;setNav(page);({home:homePage,bills:billsPage,customers:customersPage,cloth:clothPage,payments:paymentsPage,orders:ordersPage,approvals:approvalsPage}[page]||homePage)()}
    function syncAll(){Promise.allSettled([loadProducts(),loadCustomers(),loadBills(),loadPayments(),loadOrders(),state.user?.role==='ADMIN'?loadApprovals():Promise.resolve()]).then(()=>{if(state.page==='home')homePage();else navigate(state.page)})}
    function loadProducts(){return api('products').then(r=>state.cache.products=r.products||[])}
    function loadCustomers(){return api('listCustomers').then(r=>state.cache.customers=r.customers||[])}
    function loadBills(){return api('listBills').then(r=>state.cache.bills=r.bills||[])}
    function loadPayments(){return api('listPayments').then(r=>state.cache.payments=r.payments||[])}
    function loadOrders(){return api('listOrderRequests').then(r=>state.cache.orders=r.requests||[])}
    function loadApprovals(){return api('listDeletionRequests').then(r=>{state.cache.approvals=r.requests||[];const pending=state.cache.approvals.filter(x=>String(x.status).toUpperCase()==='PENDING').length;$('approvalCount').textContent=pending;$('approvalCount').classList.toggle('hidden',!pending)})}
    function pageHead(title,subtitle,buttons=''){return `<div class="page-head"><div><div class="eyebrow">Avani Suto</div><h1>${title}</h1><div class="page-sub">${subtitle}</div></div><div class="actions">${buttons}</div></div>`}
    function tableShell(searchId,placeholder,headers,rows){return `<div class="card table-card"><div class="table-toolbar"><div class="search"><span>⌕</span><input id="${searchId}" placeholder="${placeholder}"></div><div class="muted" id="resultCount">${rows.length} records</div></div><div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody id="tableRows">${rows.join('')}</tbody></table><div class="empty ${rows.length?'hidden':''}" id="tableEmpty">No records found.</div></div></div>`}
    function bindFilter(inputId,matcher){const el=$(inputId);if(!el)return;el.addEventListener('input',()=>{let count=0;document.querySelectorAll('#tableRows tr').forEach(row=>{const show=matcher(row,el.value.toLowerCase());row.classList.toggle('hidden',!show);if(show)count++});$('resultCount').textContent=`${count} records`;$('tableEmpty').classList.toggle('hidden',count>0)})}
    function homePage(){const products=state.cache.products.filter(p=>p.available!==false),due=state.cache.bills.filter(b=>!b.voided).reduce((sum,b)=>sum+Number(b.due||0),0),pending=state.cache.orders.filter(o=>String(o.status).toLowerCase()==='pending').length,recent=state.cache.bills.slice(0,6).map(b=>`<tr class="clickable" data-bill="${esc(b.invoiceNumber)}"><td class="strong">${esc(b.invoiceNumber)}</td><td>${esc(b.customerName)}</td><td>${dateShort(b.date)}</td><td class="money">${money(b.total)}</td><td><span class="status ${b.voided?'void':b.due>0?'due':''}">${b.voided?'Voided':b.due>0?'Due':'Paid'}</span></td></tr>`);
      $('page').innerHTML=pageHead('Good to see you','Your shop at a glance',`<button class="btn btn-light" onclick="syncAll()">⟳ &nbsp;Sync data</button>`)+`<div class="grid stats"><div class="card stat"><div class="stat-label">Cloth available</div><div class="stat-value">${products.length}</div><div class="stat-note">${state.cache.products.length-products.length} unavailable</div></div><div class="card stat"><div class="stat-label">Customers</div><div class="stat-value">${state.cache.customers.length}</div><div class="stat-note">Shop customer records</div></div><div class="card stat"><div class="stat-label">Outstanding due</div><div class="stat-value">${money(due)}</div><div class="stat-note">Across active bills</div></div><div class="card stat"><div class="stat-label">Open order requests</div><div class="stat-value">${pending}</div><div class="stat-note">Awaiting fulfilment</div></div></div><div class="grid quick-grid"><button class="quick" onclick="openBillModal()"><span class="quick-icon">▤</span>Create a bill</button><button class="quick" onclick="navigate('cloth')"><span class="quick-icon">＋</span>Add or find cloth</button><button class="quick" onclick="openPaymentModal()"><span class="quick-icon">₹</span>Receive a payment</button></div><div class="card panel"><div class="panel-head"><div><div class="panel-title">Recent bills</div><div class="panel-note">Latest invoices from Shop</div></div><button class="btn btn-light btn-small" onclick="navigate('bills')">All bills</button></div><div class="table-wrap"><table><thead><tr><th>Bill number</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${recent.join('')||'<tr><td colspan="5" class="empty">No bills yet</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-bill]').forEach(row=>row.onclick=()=>openBillDetail(row.dataset.bill))}

    function modal(title,content){$('modalHost').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${content}</div></div>`}

    function openCustomerModal(){modal('Add customer',`<form id="customerForm"><div class="field-grid"><div class="field"><label>Customer name *</label><input name="name" required></div><div class="field"><label>Phone number *</label><input name="phone" inputmode="tel" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Address / city</label><input name="address"></div></div><div class="modal-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save customer</button></div></form>`);$('customerForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('createCustomer',{name:f.get('name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address')});closeModal();toast('Customer added');await loadCustomers();customersPage()}catch(err){toast(err.message,true)}}}

    function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read that picture.'));reader.onload=()=>{const image=new Image();image.onerror=()=>reject(new Error('Could not open that picture.'));image.onload=()=>{const scale=Math.min(1,1000/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.76).split(',')[1]||'')};image.src=String(reader.result)};reader.readAsDataURL(file)})}
    function openBillModal(){state.cart=[];state.billCustomer=null;modal('Create a bill',`<form id="billForm"><div class="field-grid"><div class="field relative"><label>Customer phone *</label><input id="billPhone" name="phone" inputmode="tel" autocomplete="tel" required placeholder="Type phone number"><div class="suggestions hidden" id="customerSuggestions"></div></div><div class="field"><label>Customer name</label><input id="billName" name="name" placeholder="Fill if this is a new customer"></div><div class="field"><label>Payment mode</label><select name="paymentMode"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></div><div class="field"><label>Amount received (₹)</label><input name="amountReceived" type="number" min="0" step="1" value="0"></div><div class="field"><label>Initial payment method</label><select name="paymentMethod"><option>Cash</option><option>UPI</option><option>Card</option></select></div></div><div class="product-picker"><div class="field"><label>Find cloth by name or code</label><input id="billClothSearch" placeholder="Search catalogue"></div><div class="field"><label>Quantity</label><input id="billQty" type="number" min="0.001" step="0.001" value="1"></div><button type="button" class="btn btn-light" onclick="addBillItem()">Add item</button></div><div class="search" style="max-width:none"><input id="billClothChoice" placeholder="Choose a cloth from search results" list="clothOptions"><datalist id="clothOptions"></datalist></div><div class="cart" id="billCart"></div><div class="field" style="margin-top:12px"><label>Discount amount (₹)</label><input id="billDiscountValue" name="discountValue" type="number" min="0" step="1" value="0"></div><div id="billCostWarning" class="muted" style="margin-top:8px">Bill cannot be saved if its discounted total is below the combined purchase cost of its items.</div><div style="display:flex;justify-content:flex-end;font-size:16px;font-weight:700;color:var(--muted);margin-top:10px">Subtotal&nbsp; <span id="billSubtotal">₹0</span></div><div style="display:flex;justify-content:flex-end;font-size:16px;font-weight:700;color:var(--red)">Discount&nbsp; <span id="billDiscount">₹0</span></div><div style="display:flex;justify-content:flex-end;font-size:18px;font-weight:800;color:var(--navy)">Bill total&nbsp; <span id="billTotal">₹0</span></div><div class="modal-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save bill</button></div></form>`);let timer;const phone=$('billPhone');phone.oninput=()=>{clearTimeout(timer);state.billCustomer=null;timer=setTimeout(()=>searchBillCustomers(phone.value),250)};const search=$('billClothSearch');search.oninput=()=>{const q=search.value.toLowerCase();const matches=state.cache.products.filter(p=>p.available!==false&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q))).slice(0,20);$('clothOptions').innerHTML=matches.map(p=>`<option value="${esc(p.sku+' · '+p.name)}"></option>`).join('');if(matches.length===1)$('billClothChoice').value=matches[0].sku+' · '+matches[0].name};$('billDiscountValue').oninput=renderCart;$('billPhone').focus();renderCart();$('billForm').onsubmit=submitBill}
    function searchBillCustomers(query){const phone=query.replace(/\D/g,'');const list=state.cache.customers.filter(c=>phone.length<2?false:c.phone.replace(/\D/g,'').includes(phone)).slice(0,6);const box=$('customerSuggestions');box.innerHTML=list.map(c=>`<button type="button" onclick="selectBillCustomer('${esc(c.phone)}')"><b>${esc(c.name)}</b><br><small class="muted">${esc(c.phone)}</small></button>`).join('');box.classList.toggle('hidden',!list.length);state.billCustomer=list.find(c=>c.phone.replace(/\D/g,'')===phone)||null;if(state.billCustomer)$('billName').value=state.billCustomer.name}

    function addBillItem(){const value=$('billClothChoice').value,sku=value.split(' · ')[0],p=state.cache.products.find(x=>x.sku===sku||x.name.toLowerCase()===value.toLowerCase());if(!p){toast('Choose a cloth from the catalogue list.',true);return}const quantity=Number($('billQty').value);if(!Number.isFinite(quantity)||quantity<=0||(!p.fractionalQuantity&&!Number.isInteger(quantity))){toast(p.fractionalQuantity?'Enter a valid quantity.':'This cloth needs a whole-number quantity.',true);return}const existing=state.cart.find(x=>x.product.sku===p.sku);if(existing)existing.quantity+=quantity;else state.cart.push({product:p,quantity});$('billClothChoice').value='';$('billClothSearch').value='';$('billQty').value='1';renderCart()}
    function currentBillTotals(){const subtotal=Math.round(state.cart.reduce((s,x)=>s+x.product.price*x.quantity,0));const value=Number($('billDiscountValue')?.value||0);const discount=Math.round(value);return{subtotal,discount,total:subtotal-discount,value}}
    function renderCart(){const box=$('billCart');if(!box)return;box.innerHTML=state.cart.length?state.cart.map((x,i)=>`<div class="cart-row"><div><b>${esc(x.product.name)}</b><br><small class="muted">${esc(x.product.sku)} · ${money(x.product.price)} each</small></div><span>Qty ${x.quantity}</span><b>${money(x.quantity*x.product.price)}</b><button type="button" class="close" onclick="state.cart.splice(${i},1);renderCart()">×</button></div>`).join(''):'<div class="empty">Add cloth to this bill</div>';const t=currentBillTotals();$('billSubtotal').textContent=money(t.subtotal);$('billDiscount').textContent='− '+money(t.discount);$('billTotal').textContent=money(t.total);const invalid=t.value<0||t.discount>t.subtotal||t.total<=0||!Number.isFinite(t.discount);$('billCostWarning').style.color=invalid?'var(--red)':'var(--muted)';$('billCostWarning').textContent=invalid?'Discount must be valid and leave a positive bill total.':'Bill cannot be saved if its discounted total is below the combined purchase cost of its items.'}
    async function submitBill(e){e.preventDefault();if(!state.cart.length){toast('Add at least one cloth before saving.',true);return}const totals=currentBillTotals();if(totals.value<0||totals.discount>totals.subtotal||totals.total<=0){toast('Discount must be valid and leave a positive bill total.',true);return}const f=new FormData(e.target),phone=String(f.get('phone')).trim(),name=String(f.get('name')).trim();try{const r=await api('createInvoice',{customer:{name,phone,email:'',address:''},paymentMode:f.get('paymentMode'),amountReceived:Number(f.get('amountReceived')||0),paymentMethod:f.get('paymentMethod'),discountValue:Number(f.get('discountValue')||0),items:state.cart.map(x=>({sku:x.product.sku,quantity:x.quantity,discount:0}))});closeModal();toast(`Bill ${r.invoiceNumber} saved · ${money(r.total)}`);await Promise.all([loadBills(),loadPayments(),loadProducts(),loadCustomers()]);openDrawer('Bill saved',`<div class="notice">Your bill is in Shop and its PDF was saved to Drive.</div><div class="drawer-section"><div class="summary-line"><span>Bill number</span><b>${esc(r.invoiceNumber)}</b></div><div class="summary-line"><span>Subtotal</span><b>${money(r.subtotal)}</b></div><div class="summary-line"><span>Discount</span><b>− ${money(r.discount)}</b></div><div class="summary-line"><span>Total</span><b>${money(r.total)}</b></div><div class="summary-line"><span>Paid</span><b>${money(r.paid)}</b></div><div class="summary-line"><span>Due</span><b>${money(r.due)}</b></div></div><button class="btn btn-primary" onclick="openInvoicePdf('${esc(r.invoiceNumber)}')">Open invoice PDF</button>`);homePage()}catch(err){toast(err.message,true)}}
    function openPaymentModal(phone='',invoiceNumber=''){const dues=state.cache.bills.filter(b=>!b.voided&&Number(b.due)>0&&( !phone||b.phone===phone));modal('Receive payment',`<form id="paymentForm"><div class="field-grid"><div class="field full"><label>Customer / bill *</label><select name="bill" required><option value="">Choose outstanding bill</option>${dues.map(b=>`<option value="${esc(b.phone)}|${esc(b.invoiceNumber)}" ${b.invoiceNumber===invoiceNumber?'selected':''}>${esc(b.customerName)} · ${esc(b.invoiceNumber)} · due ${money(b.due)}</option>`).join('')}</select></div><div class="field"><label>Amount received (₹) *</label><input name="amount" type="number" min="1" step="1" required></div><div class="field"><label>Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Card</option></select></div><div class="field full"><label>Note</label><input name="note" placeholder="Optional note"></div></div><div class="modal-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Record payment</button></div></form>`);$('paymentForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),[customerPhone,invoice]=String(f.get('bill')).split('|');try{await api('receivePayment',{phone:customerPhone,invoiceNumber:invoice,amount:Number(f.get('amount')),method:f.get('method'),note:f.get('note'),requestId:crypto.randomUUID()});closeModal();toast('Payment recorded');await Promise.all([loadBills(),loadPayments()]);paymentsPage()}catch(err){toast(err.message,true)}}}
    function openOrderModal(){modal('Create order request',`<form id="orderForm"><div class="field-grid"><div class="field"><label>Customer phone *</label><input name="phone" required inputmode="tel"></div><div class="field"><label>Customer name (new customer)</label><input name="name"></div><div class="field full"><label>Choose cloth *</label><select name="sku" required><option value="">Select cloth</option>${state.cache.products.filter(p=>p.available!==false).map(p=>`<option value="${esc(p.sku)}">${esc(p.name)} · ${esc(p.sku)}</option>`).join('')}</select></div><div class="field"><label>Quantity *</label><input name="quantity" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Notes</label><input name="notes"></div></div><div class="modal-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Send order request</button></div></form>`);$('orderForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=state.cache.products.find(x=>x.sku===f.get('sku'));try{await api('createOrderRequest',{customerPhone:f.get('phone'),customerName:f.get('name'),items:[{sku:p.sku,productName:p.name,quantity:Number(f.get('quantity'))}],notes:f.get('notes')});closeModal();toast('Order request sent');await loadOrders();ordersPage()}catch(err){toast(err.message,true)}}}
    function reviewRequest(id,decision){const note=decision==='APPROVE'?'Approved by administrator':'Rejected by administrator';api('reviewDeletionRequest',{requestId:id,decision,note}).then(()=>{toast(`Request ${decision.toLowerCase()}d`);return Promise.all([loadApprovals(),loadProducts(),loadBills(),loadPayments()])}).then(()=>approvalsPage()).catch(e=>toast(e.message,true))}
    function toggleAvailability(sku,currentlyAvailable){if(!confirm(`${currentlyAvailable?'Make this cloth unavailable':'Make this cloth available'}?`))return;api('setProductAvailability',{sku,available:!currentlyAvailable}).then(()=>loadProducts()).then(()=>clothPage()).catch(e=>toast(e.message,true))}
    function hydrateProductPhotos(){document.querySelectorAll('[data-photo]').forEach(async node=>{const imageId=node.dataset.photo;if(!imageId)return;try{const r=await api('productImage',{imageId});if(r.data)node.innerHTML=`<img alt="" src="data:${esc(r.mimeType||'image/jpeg')};base64,${r.data}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`}catch(_){}})}
    bindNavigation();initGoogle();const cachedToken=sessionStorage.getItem('avaniToken');if(cachedToken){state.token=cachedToken;api('session').then(session=>{state.user=session;startApp()}).catch(()=>{sessionStorage.removeItem('avaniToken');state.token=''})}
  </script>
</body>
